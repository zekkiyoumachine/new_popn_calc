<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>pop'n music BPM調整ツール</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    .corpo {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #ffe259, #ffa751);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
    h1 {
      font-size: 1.4rem;
      margin: 0 0 16px;
      text-align: center;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 10px;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      background: #ff8c00;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background: #ff7a00;
    }
    .result {
      margin-top: 20px;
      padding: 12px;
      background: #f7f7f7;
      border-radius: 10px;
      text-align: center;
      font-size: 1.05rem;
    }
    .note {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body class="corpo">
  <div class="card">
    <h1>pop'n music BPM調整ツール</h1>

    <div class="field">
      <label for="v">基準BPM(HS) </label>
      <input type="number" id="v" step="any" />
    </div>

    <div class="field">
      <label for="r">ROOF (r)</label>
      <input type="number" id="r" step="any" />
    </div>

    <div class="field">
      <label for="l">LIFT (l)</label>
      <input type="number" id="l" step="any" />
    </div>

    <div class="field">
      <label>合わせたいBPM・HS</label>
      <input type="number" class="vp" step="any" placeholder="BPM①" />
    </div>

    <div class="field">
      <input type="number" class="vp" step="any" placeholder="BPM②（任意）" />
    </div>

    <div class="field">
      <input type="number" class="vp" step="any" placeholder="BPM③（任意）" />
    </div>

    <button onclick="calculate()">計算する</button>

    <div class="result" id="result">ここに結果が表示されます</div>
  </div>

  <script>
    function calculate() {
      const v = parseFloat(document.getElementById('v').value);
      const r = parseFloat(document.getElementById('r').value);
      const l = parseFloat(document.getElementById('l').value);
      const vpInputs = document.querySelectorAll('.vp');

      if ([v, r, l].some(isNaN)) {
        document.getElementById('result').textContent = '基準BPM・ROOF・LIFTを入力してください';
        return;
      }

      const abs = Math.abs;
      let outputs = [];

      vpInputs.forEach((input, index) => {
        const vp = parseFloat(input.value);
        if (!isNaN(vp)) {
          const sPrime = -1 * ((vp / v) * (390 - abs(r) - abs(l))) + 103 - abs(l);
          const rPrime = 390 - ((vp / v) * (390 - abs(r) - abs(l))) + -abs(l);
          outputs.push(`v'=${vp} → SUD ${Math.round(sPrime)} ／ ROOF ${Math.round(rPrime)}`);
        }
      });

      if (outputs.length === 0) {
        document.getElementById('result').textContent = "v' を1つ以上入力してください";
        return;
      }

      document.getElementById('result').innerHTML = outputs.join('<br>');
    }

      const abs = Math.abs;

      const sPrime = -1 * ((vp / v) * (390 - abs(r) - abs(l))) + 103 - abs(l);
      const rPrime = 390 - ((vp / v) * (390 - abs(r) - abs(l))) + -abs(l);

      document.getElementById('result').textContent = `SUDなら ${Math.round(sPrime)} ・ ROOFなら ${Math.round(rPrime)}`;
    }
  </script>
</body>
</html>
